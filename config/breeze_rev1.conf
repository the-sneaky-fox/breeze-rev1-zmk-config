# Default Prospector status screen layout (shown at boot)
# CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Touchscreen support (swipe left/right to switch screens, up/down to adjust brightness)
CONFIG_PROSPECTOR_TOUCHSCREEN=y
CONFIG_PROSPECTOR_SCREEN_CLASSIC_ENABLED=y
CONFIG_PROSPECTOR_SCREEN_RADII_ENABLED=y
CONFIG_PROSPECTOR_SCREEN_FIELD_ENABLED=y
CONFIG_PROSPECTOR_SCREEN_OPERATOR_ENABLED=y

# Increase LVGL heap so all 4 screen trees + slide animations fit in memory simultaneously
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_VDB_SIZE=20

# Modifier key style (Windows: WIN/ALT/CTRL/SHFT, Generic: GUI/ALT/CTRL/SHFT, Mac: CMD/OPT/CTRL/SHFT)
CONFIG_PROSPECTOR_MODIFIER_OS_WINDOWS=y
# CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y
# CONFIG_PROSPECTOR_MODIFIER_OS_MAC=y

# Brightness & display orientation
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
